
name: Build Font Finder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "FontFinderStarter.zip" -DestinationPath "extracted" -Force

          $project = Get-ChildItem -Path "extracted" -Recurse -Filter "*.csproj" |
            Select-Object -First 1

          if (-not $project) {
            throw "No C# project file found in ZIP."
          }

          "PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"

      - name: Build application
        shell: pwsh
        run: |
          msbuild "$env:PROJECT_PATH" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Check build output
        shell: pwsh
        run: |
          $output = Get-ChildItem -Path "extracted" -Recurse -Filter "FontFinder.exe" |
            Where-Object { $_.FullName -match "\\Release\\" } |
            Select-Object -First 1

          if (-not $output) {
            throw "FontFinder.exe was not generated."
          }

          Write-Host "Build output found: $($output.FullName)"
          "OUTPUT_PATH=$($output.DirectoryName)" >> $env:GITHUB_ENV

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: FontFinder-Windows
          path: ${{ env.OUTPUT_PATH }}/**
          if-no-files-found: error
